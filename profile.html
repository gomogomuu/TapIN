<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | TapIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="profile-container">
        <div class="profile-card">
            <img id="profileImage" src="https://placehold.co/150x150" alt="Profile Photo" class="profile-image">
            <h1 id="profileName">Loading...</h1>
            <p id="profileBio">Please wait while we load the profile.</p>
            <div id="links" class="links"></div>
            <p class="powered">Powered by TapIN</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
